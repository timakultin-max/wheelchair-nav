<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Доступный маршрут — Москва</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="controls">
    <div class="row">
      <input id="from" type="text" placeholder="Откуда" autocomplete="off" />
      <button class="geo-btn" onclick="useMyLocation()" title="Моё местоположение">📍</button>
    </div>
    <div id="fromSuggest" class="suggest"></div>

    <input id="to" type="text" placeholder="Куда" autocomplete="off" />
    <div id="toSuggest" class="suggest"></div>

    <div class="buttons">
      <button id="buildBtn" onclick="buildRoute()">Построить маршрут</button>
      <button id="voiceBtn" onclick="toggleVoice()">🔊</button>
    </div>

    <button id="layersToggle" onclick="toggleLayers()">♿ Слои доступности</button>

    <div id="layers" class="layers hidden">
      <label><input type="checkbox" id="layerRamps" checked onchange="toggleLayer('ramps')"> 🔵 Пандусы</label>
      <label><input type="checkbox" id="layerEntrances" checked onchange="toggleLayer('entrances')"> 🟢 Доступные входы</label>
      <label><input type="checkbox" id="layerElevators" checked onchange="toggleLayer('elevators')"> 🟣 Лифты</label>
      <label><input type="checkbox" id="layerToilets" checked onchange="toggleLayer('toilets')"> 🟠 Доступные туалеты</label>
      <label><input type="checkbox" id="layerParking" checked onchange="toggleLayer('parking')"> 🟡 Парковки для инвалидов</label>
      <label><input type="checkbox" id="layerNoAccess" checked onchange="toggleLayer('noAccess')"> 🔴 Недоступно</label>
    </div>

    <div id="status"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
